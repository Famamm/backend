$kind: http-request
name: /api/auth/login(admin)
description: Login admin. Script menyimpan accessToken ke {{token}} dan refreshToken ke {{adminRefreshToken}}.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "identity": "{{adminUser}}",
      "password": "{{adminPass}}"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "identity": {
          "type": "string"
        },
        "password": {
          "type": "string"
        }
      },
      "required": [
        "identity",
        "password"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('dapat accessToken', () => pm.expect(d.accessToken).to.be.a('string'));
      pm.test('dapat refreshToken', () => pm.expect(d.refreshToken).to.be.a('string'));
      pm.environment.set('token', d.accessToken);
      pm.environment.set('adminRefreshToken', d.refreshToken);
    language: text/javascript
settings: {}
examples: .resources/-api-auth-login(admin).resources/examples
order: 1000
