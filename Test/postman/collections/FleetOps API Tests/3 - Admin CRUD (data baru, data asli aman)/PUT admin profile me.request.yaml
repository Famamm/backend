$kind: http-request
url: "{{baseUrl}}/api/admin/profile/me"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: FullName
      value: hammam
    - type: text
      key: Address
      value: Pasuruan
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000
