$kind: http-request
url: "{{baseUrl}}/api/drivers/profile/me/vehicle"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "vehicleId": {{vehicleId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
