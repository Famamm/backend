$kind: http-request
url: "{{baseUrl}}/api/drivers/trips/driver/{{loggedDriverId}}/active"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('trip aktif ditemukan', () => pm.expect(pm.response.json().data.status).to.eql('Ongoing'));
    language: text/javascript
order: 10000
