$kind: http-request
url: "{{baseUrl}}/api/drivers/inspections"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: DriverId
      value: "{{loggedDriverId}}"
    - type: text
      key: VehicleId
      value: "{{vehicleId}}"
    - type: text
      key: Results[0].ItemId
      value: "{{inspectionItemId}}"
    - type: text
      key: Results[0].Condition
      value: "1"
scripts:
  - type: afterResponse
    code: pm.test('ditolak 400 - sudah inspeksi hari ini', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
