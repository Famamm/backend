$kind: http-request
url: "{{baseUrl}}/api/drivers/trips/{{tmpTripId}}/gps"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "points": [
        {
          "clientId": "{{$guid}}",
          "latitude": -7.2451,
          "longitude": 112.7321,
          "capturedAt": "{{$isoTimestamp}}",
          "accuracyMeters": 8.5
        },
        {
          "clientId": "{{$guid}}",
          "latitude": -7.2455,
          "longitude": 112.7328,
          "capturedAt": "{{$isoTimestamp}}",
          "accuracyMeters": 7.2
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('menerima batch GPS', () => pm.expect(d.receivedCount).to.eql(2));
      pm.test('menyimpan titik GPS', () => pm.expect(d.savedCount).to.be.at.least(1));
    language: text/javascript
order: 8000
