$kind: http-request
url: "{{baseUrl}}/api/drivers/inspections"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: DriverId
      value: "{{loggedDriverId}}"
    - type: text
      key: VehicleId
      value: "{{vehicleId}}"
    - type: text
      key: Results[0].ItemId
      value: "{{inspectionItemId}}"
    - type: text
      key: Results[0].Condition
      value: "1"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('dapat inspection id', () => pm.expect(d.inspection.id).to.be.a('number'));
      pm.environment.set('tmpInspectionId', d.inspection.id);
    language: text/javascript
order: 3000
