$kind: http-request
url: "{{baseUrl}}/api/admin/vehicles/{{vehicleId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('field lengkap (beda dgn list yg ringkas)', () => {
        pm.expect(d.tipe).to.not.eql('');
        pm.expect(d.status).to.not.eql('');
      });
    language: text/javascript
order: 4000
