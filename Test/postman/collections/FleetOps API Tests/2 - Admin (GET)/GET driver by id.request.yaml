$kind: http-request
url: "{{baseUrl}}/api/admin/drivers/{{driverId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('driverId cocok', () => pm.expect(pm.response.json().driverId).to.eql(Number(pm.collectionVariables.get('driverId'))));
    language: text/javascript
order: 2000
