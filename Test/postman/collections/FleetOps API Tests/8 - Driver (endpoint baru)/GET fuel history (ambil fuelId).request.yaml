$kind: http-request
url: "{{baseUrl}}/api/drivers/fuel/history"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('data array', () => pm.expect(d).to.be.an('array'));
      if (d.length > 0) { pm.environment.set('tmpFuelId', d[0].fuelId); }
    language: text/javascript
order: 7000
