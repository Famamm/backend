$kind: http-request
url: "{{baseUrl}}/api/drivers/statistics/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('ada field statistik', () => {
        pm.expect(d).to.have.property('totalJarak');
        pm.expect(d).to.have.property('totalTrip');
        pm.expect(d).to.have.property('totalJamMengemudi');
        pm.expect(d).to.have.property('rataRataKecepatan');
      });
    language: text/javascript
order: 2000
