$kind: http-request
url: "{{baseUrl}}/api/drivers/trips/{{tmpTripId}}/cancel"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "driverId": {{loggedDriverId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 12000
