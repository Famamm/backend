$kind: http-request
url: "{{baseUrl}}/api/drivers/profile/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json().data;
      pm.test('ada field kendaraan (dipakai mobile)', () => {
        pm.expect(d).to.have.property('kendaraanAktif');
        pm.expect(d).to.have.property('semuaKendaraan');
        pm.expect(d).to.have.property('kendaraanTersedia');
      });
      pm.test('ada dokumen SIM', () => pm.expect(d.dokumen).to.have.property('jenisLisensi'));
    language: text/javascript
order: 1000
