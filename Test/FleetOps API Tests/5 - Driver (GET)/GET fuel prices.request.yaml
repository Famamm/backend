$kind: http-request
url: "{{baseUrl}}/api/drivers/fuel/prices"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('BioSolar ada (bukan BioSolar (Subsidi))', () => {
        pm.expect(pm.response.text()).to.include('BioSolar');
        pm.expect(pm.response.text()).to.not.include('BioSolar (Subsidi)');
      });
    language: text/javascript
order: 3000
