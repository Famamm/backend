$kind: http-request
url: "{{baseUrl}}/api/admin/drivers/{{tmpDriverId}}"
method: PUT
body:
  type: formdata
  content:
    - type: text
      key: FullName
      value: ZZ Driver EDITED
scripts:
  - type: afterResponse
    code: |-
      pm.test('validasi jalan, ditolak 400', () => pm.response.to.have.status(400));
      pm.test('pesan menyebut tanggal berlaku', () => pm.expect(pm.response.text()).to.include('Tanggal berlaku'));
    language: text/javascript
order: 4000
