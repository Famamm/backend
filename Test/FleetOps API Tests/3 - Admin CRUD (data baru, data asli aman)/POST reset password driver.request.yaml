$kind: http-request
url: "{{baseUrl}}/api/admin/drivers/{{tmpDriverId}}/password/reset"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('dapat password baru', () => pm.expect(pm.response.json().generatedPassword).to.be.a('string'));
    language: text/javascript
order: 6000
