$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identity": "{{adminUser}}",
      "password": "pasti-salah-123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('password salah ditolak 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
