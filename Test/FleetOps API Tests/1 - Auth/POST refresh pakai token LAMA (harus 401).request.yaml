$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{adminRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('token bekas ditolak 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
