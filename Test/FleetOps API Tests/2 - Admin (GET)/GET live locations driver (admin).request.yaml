$kind: http-request
url: "{{baseUrl}}/api/trips/live-locations"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('count cocok dengan jumlah data', () => pm.expect(b.data.length).to.eql(b.count));
    language: text/javascript
order: 8000
