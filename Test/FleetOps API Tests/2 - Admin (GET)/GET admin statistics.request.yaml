$kind: http-request
url: "{{baseUrl}}/api/admin/statistics"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('ada data statistik admin', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('data');
        pm.expect(json.data).to.have.property('aktivitasArmada');
        pm.expect(json.data).to.have.property('totalPerjalanan');
        pm.expect(json.data).to.have.property('aktivitasBbm');
        pm.expect(json.data).to.have.property('totalBbmLiter');
        pm.expect(json.data).to.have.property('totalHargaBbm');
        pm.expect(json.data).to.have.property('jenisBbm');
        pm.expect(json.data).to.have.property('rincianJenisBbm');
      });
    language: text/javascript
order: 7000
