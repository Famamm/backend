$kind: http-request
url: "{{baseUrl}}/api/admin/dashboard/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('has statistics fields', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('aktivitasArmada');
        pm.expect(json).to.have.property('totalPerjalanan');
        pm.expect(json).to.have.property('aktivitasBbm');
        pm.expect(json).to.have.property('totalBbmLiter');
        pm.expect(json).to.have.property('totalHargaBbm');
        pm.expect(json).to.have.property('jenisBbm');
        pm.expect(json).to.have.property('rincianJenisBbm');
      });
    language: text/javascript
order: 6000
