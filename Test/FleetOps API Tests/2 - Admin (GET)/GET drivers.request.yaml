$kind: http-request
url: "{{baseUrl}}/api/admin/drivers"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('response array', () => pm.expect(d).to.be.an('array'));
      pm.test('semua driver dari organisasi sendiri', () => {
        pm.expect(d.length).to.be.above(0);
      });
    language: text/javascript
order: 1000
