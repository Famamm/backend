$kind: http-request
url: "{{baseUrl}}/api/fleet-manager/maintenances/{{tmpMaintenanceId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "jenis": "Servis rutin ZZ EDITED",
      "targetOdometer": 999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('jenis berubah', () => pm.expect(pm.response.json().data.jenis).to.eql('Servis rutin ZZ EDITED'));
    language: text/javascript
order: 15000
