$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identity": "{{fleetManagerUser}}",
      "password": "{{fleetManagerPass}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const d = pm.response.json();
      pm.test('role FleetManager', () => pm.expect(d.user.roleName).to.eql('FleetManager'));
      pm.environment.set('token', d.accessToken);
    language: text/javascript
order: 4000
