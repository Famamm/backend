$kind: http-request
url: "{{baseUrl}}/api/fleet-manager/assignments"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "vehicleId": {{vehicleId}},
      "driverId": {{driverId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000
