$kind: http-request
name: PUT status maintenance -> InProgress
url: "{{baseUrl}}/api/fleet-manager/maintenances/{{tmpMaintenanceId}}/status"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "InProgress",
      "odometer": 999999,
      "biaya": 250000,
      "catatan": "ZZ tes otomatis"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('status InProgress', () => pm.expect(pm.response.json().data.status).to.eql('InProgress'));
    language: text/javascript
order: 16000
