$kind: http-request
name: PUT status maintenance -> Completed
url: "{{baseUrl}}/api/fleet-manager/maintenances/{{tmpMaintenanceId}}/status"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "Completed",
      "odometer": 999999,
      "biaya": 250000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('status Completed', () => pm.expect(pm.response.json().data.status).to.eql('Completed'));
    language: text/javascript
order: 18000
